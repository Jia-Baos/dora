nodes:
    - id: node-cpp-api
      path: install/bin/node_cpp_api
      inputs:
          tick: dora/timer/millis/300
      outputs:
          - image

    - id: node-plot
      path: install/bin/node_plot
      inputs:
          image: node-cpp-api/image

    - id: runtime-node-1
      path: ../../target/debug/dora-rerun-node
      inputs:
          image: node-cpp-api/image
      env:
          RERUN_FLUSH_TICK_SECS: 0.001
          RERUN_MEMORY_LIMIT: 25%
