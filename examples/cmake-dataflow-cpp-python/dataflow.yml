nodes:
    - id: node-cpp-api
      path: bin/node_cpp_api
      inputs:
          tick: dora/timer/millis/300
      outputs:
          - counter

    - id: runtime-node-1
      custom:
          source: node-python-api/main.py
          inputs:
              counter_1: node-cpp-api/counter
          outputs:
              - status

    - id: runtime-node-2
      operator:
          python: operator-python-api/main.py
          inputs:
              counter_1: node-cpp-api/counter
          outputs:
              - status

